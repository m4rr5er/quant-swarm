# Per-agent switches & params. Each agent is an independent process;
# `llm_profile` references a named profile in settings.yaml -> llm.profiles.

agents:
  market_data:
    enabled: true
    provider: akshare         # mock | akshare | tushare
    params:
      bar_interval: "1d"
      n_bars: 60
      adjust: qfq             # forward-adjusted daily bars
      # seed: 42              # mock provider only

  fundamentals:
    enabled: true
    llm_profile: default      # NLP sentiment scoring model (later milestone)
    # params:
    #   cron: "0 10 * * 1-5"  # optional per-agent collect schedule override

  capital_flow:
    enabled: true
    provider: akshare
    params:
      days: 5                 # recent fund-flow rows per card

  event_monitor:
    enabled: true             # reactive: listens to market cards, no polling
    params:
      spike_pct: 0.05         # |day change| >= 5%  -> WARN
      critical_pct: 0.09      # |day change| >= 9%  -> CRITICAL (down = veto)

  risk_review:
    enabled: false

  brain:
    enabled: true
    llm_profile: default
    params:
      use_llm: true           # false -> MACrossPolicy only
      prompt_version: "decision_v1"

  backtester:
    enabled: true
    provider: akshare         # mock | akshare
    params:
      n_bars: 250             # ~1y of daily bars per replay
      ttl_sec: 86400

  execution:
    enabled: true
    broker: paper             # paper only in MVP
    params:
      require_manual_confirm: true
      veto_ttl_sec: 1800      # CRITICAL risk veto blocks orders this long

  # --- decision-AI layer (M5): the only user-facing agents -------------
  chat:
    enabled: true             # router + session store: qs.chat.in -> qs.expert.*

  investor:
    enabled: true
    llm_profile: default      # strong model recommended
    params:
      max_rounds: 8           # tool/acceptance loop iterations per task
      collect_wait_sec: 25    # how long to wait for cards after dispatch

  quant:
    enabled: true
    llm_profile: default
    params:
      max_rounds: 8
      collect_wait_sec: 25
