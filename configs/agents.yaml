# Per-agent switches & params. Each agent is an independent process;
# `llm_profile` references a named profile in settings.yaml -> llm.profiles.

agents:
  market_data:
    enabled: true
    provider: akshare         # mock | akshare | tushare
    params:
      bar_interval: "1d"
      n_bars: 60
      adjust: qfq             # forward-adjusted daily bars
      # seed: 42              # mock provider only

  fundamentals:
    enabled: true
    llm_profile: default      # NLP sentiment scoring model (later milestone)
    # params:
    #   cron: "0 10 * * 1-5"  # optional per-agent collect schedule override

  capital_flow:
    enabled: true
    provider: akshare
    params:
      days: 5                 # recent fund-flow rows per card

  event_monitor:
    enabled: true             # reactive: listens to market cards, no polling
    params:
      spike_pct: 0.05         # |day change| >= 5%  -> WARN
      critical_pct: 0.09      # |day change| >= 9%  -> CRITICAL (down = veto)

  risk_review:
    enabled: false

  brain:
    enabled: true
    llm_profile: default
    params:
      use_llm: true           # false -> MACrossPolicy only
      prompt_version: "decision_v1"

  execution:
    enabled: true
    broker: paper             # paper only in MVP
    params:
      require_manual_confirm: true
      veto_ttl_sec: 1800      # CRITICAL risk veto blocks orders this long
