[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-swarm"
version = "0.1.0"
description = "AI-assisted investment decision & quantitative analysis desktop system (multi-agent, LLM-powered)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "m4rr5er" }]
dependencies = [
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "apscheduler>=3.10,<4.0",
    "nats-py>=2.9,<3.0",
    "openai>=1.50,<2.0",
    "loguru>=0.7,<1.0",
    "pyyaml>=6.0,<7.0",
    "tenacity>=8.4,<10.0",
    "httpx>=0.27,<1.0",
    "typer>=0.12,<1.0",
    "akshare>=1.16,<2.0",
    "pandas>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
qs = "quant_swarm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_swarm"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "W"]

[tool.ruff.lint.per-file-ignores]
# `timeout` is the wire-level contract (mirrors nats-py's request API),
# not an internal duration — asyncio.timeout() doesn't apply here.
"src/quant_swarm/core/bus/*" = ["ASYNC109"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
