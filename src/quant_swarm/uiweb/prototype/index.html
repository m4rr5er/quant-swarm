<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quant$warm Terminal — 原型 v2 (TV 1:1)</title>
<script src="../static/vendor/lightweight-charts.js"></script>
<script src="../static/vendor/marked.min.js"></script>
<script src="../static/vendor/purify.min.js"></script>
<script src="./tv-icons.js"></script>
<link rel="stylesheet" href="./fonts/misans/MiSans-Regular.min.css">
<link rel="stylesheet" href="./fonts/misans/MiSans-Medium.min.css">
<link rel="stylesheet" href="./fonts/misans/MiSans-Semibold.min.css">
<link rel="stylesheet" href="./fonts/misans/MiSans-Bold.min.css">
<style>
@font-face{font-family:"Geist Sans";src:url("../static/vendor/fonts/geist-sans-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Geist Sans";src:url("../static/vendor/fonts/geist-sans-500.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Geist Sans";src:url("../static/vendor/fonts/geist-sans-600.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Geist Sans";src:url("../static/vendor/fonts/geist-sans-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Geist Mono";src:url("../static/vendor/fonts/geist-mono-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Geist Mono";src:url("../static/vendor/fonts/geist-mono-500.woff2") format("woff2");font-weight:500;font-display:swap}
/* ══ TradingView dark tokens（取自 tv-dark.png 实测） ══ */
:root{
  --bg:#131313;           /* chart/page base */
  --panel:#1e1e1e;        /* watchlist/detail panel */
  --panel2:#161616;       /* header/footer */
  --hover:#2a2a2a;
  --active:#333;
  --border:#2a2a2a;
  --border-soft:#1f1f1f;
  --text:#dbdbdb;
  --text2:#b8b8b8;
  --muted:#8c8c8c;
  --dim:#5c5c5c;
  --blue:#2962ff;
  --blue-soft:#1e53e5;
  --up:#089981;
  --down:#f23645;
  --purple:#9c6dff;
  --amber:#ff9800;
  --tag-red:#f23645;
  --sans:"Geist Sans","MiSans",-apple-system,"Trebuchet MS","PingFang SC",sans-serif;
  --mono:"Geist Mono","MiSans",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
input,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#383838;border-radius:6px;border:2px solid var(--bg)}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.fill{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}

/* ══ 顶栏 ══ */
#topbar{height:38px;display:flex;align-items:center;background:var(--bg);border-bottom:1px solid var(--border-soft);padding:0 4px;gap:1px}
#topbar .tbtn{height:32px;min-width:32px;padding:0 7px;border-radius:4px;color:var(--text2);font-size:13px;gap:5px}
#topbar .tbtn:hover{background:var(--hover);color:var(--text)}
#topbar .tbtn b{font-weight:600;font-size:13.5px}
#topbar .sep{width:1px;height:20px;background:var(--border);margin:0 4px;flex:none}
#topbar .cnt{font-size:10.5px;color:var(--muted);padding:0 4px}
#topbar .right{margin-left:auto;display:flex;align-items:center;gap:1px}
#saveBtn{font-size:12px;color:var(--text2);gap:4px}
.avatar{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#f0b90b,#e57373);margin:0 6px}
#tradeBtn{background:transparent;border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;border-radius:4px;padding:4px 12px;margin:0 4px}
#tradeBtn:hover{background:var(--hover)}
#upgBtn{background:var(--blue);color:#fff;font-size:12px;font-weight:700;border-radius:4px;padding:4px 12px}
#upgBtn:hover{background:var(--blue-soft)}
kbd{font:10px var(--mono);background:var(--hover);border-radius:3px;padding:1px 5px;color:var(--muted)}

/* ══ 下拉菜单（TV 同款） ══ */
.dmenu{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:5px;min-width:200px;box-shadow:0 10px 32px rgba(0,0,0,.6);animation:fadeIn .1s var(--ease)}
.dmenu .mi{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:5px;font-size:12.5px;color:var(--text2);cursor:pointer;white-space:nowrap}
.dmenu .mi:hover{background:var(--hover);color:var(--text)}
.dmenu .mi.on{color:var(--text)}
.dmenu .mi .chk{width:14px;color:var(--blue);font-size:12px;flex:none}
.dmenu .mi .kv{margin-left:auto;font-size:11px;color:var(--muted)}
.dmenu .mi svg{width:15px;height:15px;color:var(--muted);flex:none}
.dmenu .msec{padding:6px 10px 3px;font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dmenu .msept{height:1px;background:var(--border-soft);margin:4px 6px}
.dmenu .msrc{margin:4px 6px 6px;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px;width:calc(100% - 12px);outline:none}
#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%);z-index:99;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:12.5px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.55);opacity:0;transition:opacity .18s;pointer-events:none}
#toast.show{opacity:1}
/* 通用面板行 */
.gp-row{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid var(--border-soft);font-size:12.5px;cursor:pointer}
.gp-row:hover{background:var(--hover)}
.gp-sec{padding:10px 14px 4px;font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.gp-btn{margin:12px 14px;display:block;width:calc(100% - 28px);padding:7px 0;text-align:center;background:var(--blue);color:#fff;border-radius:5px;font-size:12.5px;font-weight:600}
.gp-btn:hover{background:var(--blue-soft)}
.gp-sub{font-size:11px;color:var(--muted)}

/* ══ 标的行 ══ */
#symline{height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--bg);border-bottom:1px solid var(--border-soft)}
#symline .dot{width:7px;height:7px;border-radius:50%;background:var(--up)}
#symline .name{font-weight:600;font-size:12.5px}
#symline .meta{color:var(--muted);font-size:11.5px;display:flex;gap:4px;align-items:center}
#symline .ohlc{display:flex;gap:8px;font-size:11.5px;color:var(--muted);margin-left:6px}
#spread{display:flex;align-items:center;gap:0;margin-left:2px;font-size:11px;border:1px solid var(--border);border-radius:3px;overflow:hidden}
#spread .s{padding:2px 7px;background:rgba(242,54,69,.15);color:var(--down);font-weight:600}
#spread .b{padding:2px 7px;background:rgba(8,153,129,.15);color:var(--up);font-weight:600}
#spread .g{padding:2px 5px;color:var(--muted)}

/* ══ 主区 ══ */
#mid{flex:1;display:flex;min-height:0;position:relative}
#shell{display:flex;flex-direction:column;height:100vh}

/* 左侧工具轨 */
#rail{width:50px;flex:none;display:flex;flex-direction:column;align-items:center;background:var(--bg);border-right:1px solid var(--border-soft);padding-top:2px}
#rail button{width:38px;height:38px;margin:1px 0;border-radius:6px;color:var(--muted);position:relative}
#rail button:hover{background:var(--hover);color:var(--text)}
#rail button.on{color:var(--blue)}
#rail button.on::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--blue)}
#rail .sep{width:26px;height:1px;background:var(--border);margin:6px 0}
#rail .grow{flex:1}
#rail button[disabled]{opacity:.32;cursor:default}
#rail button[disabled]:hover{background:none;color:var(--muted)}

/* 图区 */
#chartzone{flex:1;position:relative;min-width:0}
#chart{position:absolute;inset:0 0 0 0}
#legend{position:absolute;top:8px;left:10px;z-index:6;pointer-events:none}
#legend .l1{display:flex;align-items:center;gap:6px;font-size:11.5px}
#legend .l1 .ind{color:var(--muted)}
#legend .l1 b{font-size:12px}
#legend .ohlc{display:flex;gap:7px;margin-top:1px;font-size:11px;color:var(--muted)}
#watermark{position:absolute;left:10px;bottom:8px;z-index:5;color:var(--dim);font-weight:700;font-size:13px;letter-spacing:.02em;display:flex;align-items:center;gap:5px;opacity:.9;pointer-events:none}
#mtip,.dmark{position:absolute;z-index:9;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:11.5px;pointer-events:none;display:none;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.dmark{max-width:250px;white-space:normal}

/* 右坞 */
#rdock{display:flex;flex:none}
#rpanel{width:330px;background:var(--panel);border-left:1px solid var(--border-soft);display:flex;flex-direction:column;min-width:260px;max-width:520px;overflow:hidden}
#rszR{width:4px;flex:none;cursor:col-resize;background:transparent}
#rszR:hover{background:var(--blue)}
#rrail{width:44px;flex:none;background:var(--bg);border-left:1px solid var(--border-soft);display:flex;flex-direction:column;align-items:center;padding-top:4px}
#rrail button{width:36px;height:36px;border-radius:6px;color:var(--muted);margin:1px 0}
#rrail button:hover{background:var(--hover);color:var(--text)}
#rrail button.on{background:var(--hover);color:var(--text)}
#rrail .grow{flex:1}

/* 面板头部 */
.ptabs{display:flex;align-items:center;height:38px;padding:0 10px;border-bottom:1px solid var(--border-soft);gap:2px}
.ptabs .t{font-size:13px;font-weight:600;color:var(--text);padding:4px 8px;border-radius:4px;cursor:pointer}
.ptabs .t:hover{background:var(--hover)}
.ptabs .sp{margin-left:auto;display:flex;gap:2px}
.ptabs .sp button{width:26px;height:26px;border-radius:4px;color:var(--muted)}
.ptabs .sp button:hover{background:var(--hover);color:var(--text)}
.pane{flex:1;overflow:auto;min-height:0}
.pane[hidden]{display:none!important}
.pane.flexcol{display:flex;flex-direction:column}

/* watchlist */
.wl-head{display:flex;padding:7px 14px 5px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border-soft)}
.wl-head span:nth-child(1){flex:1.6}
.wl-head span{flex:1;text-align:right}
.wl-sec{padding:6px 14px 3px;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;display:flex;align-items:center;gap:5px;cursor:pointer}
.wl-row{display:flex;align-items:center;padding:5px 14px;cursor:pointer;font-size:12px}
.wl-row:hover{background:rgba(255,255,255,.04)}
.wl-row.sel{background:rgba(41,98,255,.12);border-radius:4px}
.wl-row .lg{width:14px;height:14px;border-radius:3px;flex:none;margin-right:7px;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff}
.wl-row .sym{flex:1.6;font-weight:600;display:flex;align-items:center}
.wl-row .last,.wl-row .chg,.wl-row .pct{flex:1;text-align:right;font-variant-numeric:tabular-nums}
.wl-row .sym .fl{width:4px;height:4px;border-radius:50%;background:var(--purple);margin-left:5px}

/* 详情卡 */
#symcard{border-top:1px solid var(--border-soft);padding:12px 14px;flex:none}
#symcard .row1{display:flex;align-items:center;gap:8px}
#symcard .px{font-size:24px;font-weight:700;letter-spacing:-.01em}
#symcard .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
#symcard .overnight{margin-top:10px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:11.5px}
#symcard .overnight b{color:var(--purple)}
#symcard .vbar{margin-top:10px}
#symcard .vbar .lbls{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
#symcard .vbar .bar{height:4px;background:var(--hover);border-radius:2px;margin-top:3px;overflow:hidden}
#symcard .vbar .bar i{display:block;height:100%;background:var(--blue)}

/* chat pane */
#chatlog{display:flex;flex-direction:column;gap:10px;padding:12px}
.msg{display:flex;gap:8px;animation:msgin .2s var(--ease)}
.msg .av{width:20px;height:20px;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#131313}
.msg .who{font-size:10px;color:var(--muted);margin-bottom:2px}
.msg .who b{color:var(--text2);font-weight:600}
.msg .bd{max-width:88%;font-size:12px}
.msg.user{flex-direction:row-reverse}
.msg.user .bd .txt{background:var(--blue);color:#fff;border-radius:8px 2px 8px 8px}
.msg .txt{background:var(--hover);border-radius:2px 8px 8px 8px;padding:7px 10px}
.msg .txt p{margin:3px 0}.msg .txt table{font-size:11px;margin:5px 0}
.msg .txt th{background:var(--bg);color:var(--text2)}
.msg .txt td,.msg .txt th{border:1px solid var(--border);padding:2px 8px}
.msg .txt code{font-family:var(--mono);font-size:11px;background:var(--bg);padding:1px 4px;border-radius:3px}
@keyframes msgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.typing{display:flex;gap:3px;padding:9px 10px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}
#composer{border-top:1px solid var(--border-soft);padding:8px;display:flex;gap:6px;align-items:flex-end;flex:none}
#composer textarea{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:7px 9px;font-size:12px;resize:none;outline:none;min-height:32px;max-height:100px}
#composer textarea:focus{border-color:var(--blue)}
#send{width:32px;height:32px;border-radius:5px;background:var(--blue);color:#fff;flex:none}
#send:hover{background:var(--blue-soft)} #send:disabled{opacity:.4}

/* 决策条目 */
.drow{padding:8px 14px;border-bottom:1px solid var(--border-soft);cursor:pointer}
.drow:hover{background:rgba(255,255,255,.04)}
.drow .t{display:flex;align-items:center;gap:7px;font-size:12px}
.drow .r{font-size:11px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bdg{display:inline-flex;align-items:center;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700}
.b-buy{background:rgba(8,153,129,.18);color:var(--up)}
.b-sell{background:rgba(242,54,69,.18);color:var(--down)}
.b-warn{background:rgba(255,152,0,.16);color:var(--amber)}
.b-mut{background:var(--hover);color:var(--muted)}

/* ══ 底栏 ══ */
#bbar{height:30px;flex:none;display:flex;align-items:center;background:var(--bg);border-top:1px solid var(--border-soft);padding:0 8px;gap:2px}
#bbar .logo{display:flex;align-items:center;gap:5px;color:var(--text2);font-weight:700;font-size:11.5px;margin-right:6px}
#bbar .logo svg{width:16px;height:16px}
#bbar .rng{padding:3px 8px;border-radius:3px;font-size:11px;color:var(--muted)}
#bbar .rng:hover{background:var(--hover);color:var(--text)}
#bbar .rng.on{color:var(--blue);font-weight:600}
#bbar .right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
#bbar .kbtn{color:var(--blue);font-weight:600}
#bbar .kbtn:hover{text-decoration:underline}

/* ⌘K */
#cmdk{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding-top:15vh}
#cmdk.open{display:flex;animation:msgin .15s var(--ease)}
#cmdk .box{width:480px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
#cmdk input{width:100%;background:none;border:none;outline:none;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--border-soft)}
#cmdk .list{max-height:320px;overflow:auto;padding:5px}
#cmdk .it{display:flex;align-items:center;gap:10px;padding:8px 11px;cursor:pointer;font-size:13px;border-radius:5px}
#cmdk .it.sel{background:var(--hover)}
#cmdk .it .lg{width:18px;height:18px;border-radius:4px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff}
#cmdk .it .nm{color:var(--muted);font-size:11.5px;margin-left:auto}
#cmdk .foot{padding:8px 14px;border-top:1px solid var(--border-soft);font-size:10.5px;color:var(--dim);display:flex;gap:14px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:32px 10px;color:var(--dim);text-align:center;font-size:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="shell">

  <!-- ═══ 顶栏 ═══ -->
  <header id="topbar"></header>

  <!-- ═══ 标的行 ═══ -->
  <div id="symline">
    <span class="dot"></span>
    <span class="name" id="symTitle">贵州茅台</span>
    <span class="meta">· 1D · SH · A股</span>
    <span class="meta" style="color:var(--purple)">🌙 盘前</span>
    <span class="meta">≈ akshare 数据</span>
    <div class="ohlc num" id="lgOhlc"></div>
    <div id="spread" class="num"><span class="s" id="spSell">—</span><span class="g">卖出</span><span class="g">|</span><span class="b" id="spBuy">—</span><span class="g">买入</span></div>
  </div>

  <!-- ═══ 主区 ═══ -->
  <div id="mid">
    <nav id="rail"></nav>

    <div id="chartzone">
      <div id="legend">
        <div class="l1"><b id="lgSym">600519.SH</b><span class="ind">· MA · <span style="color:#2962ff">20</span> <span style="color:#f0b90b">50</span> · VOL · RSI(14)</span></div>
        <div class="ohlc" id="lgOhlc2"></div>
      </div>
      <div id="chart"></div>
      <div id="watermark"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><circle cx="12" cy="12" r="10" fill="none" stroke="#5c5c5c" stroke-width="2"/><path d="M7 15l3-6 3 4 4-7" stroke="#5c5c5c" stroke-width="2" fill="none" stroke-linecap="round"/></svg> Quant$warm</div>
      <div id="mtip"></div><div class="dmark" id="dmark"></div>
    </div>

    <div id="rdock">
      <div id="rszR"></div>
      <div id="rpanel">
        <div class="ptabs">
          <span class="t" id="ptitle">自选</span>
          <div class="sp">
            <button id="addSymBtn" title="添加标的"><svg class="ic" style="width:15px" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            <button id="wlViewBtn" title="列表视图"><svg class="ic" style="width:15px" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></button>
            <button id="wlMoreBtn" title="更多"><svg class="ic" style="width:15px" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" class="fill"/><circle cx="12" cy="12" r="1.6" class="fill"/><circle cx="19" cy="12" r="1.6" class="fill"/></svg></button>
          </div>
        </div>
        <div class="pane" id="p-watch">
          <div class="wl-head"><span>代码</span><span>最新</span><span>涨跌</span><span>幅度</span></div>
          <div id="wlist"></div>
          <div id="symcard"></div>
        </div>
        <div class="pane flexcol" id="p-chat" hidden>
          <div id="chatlog" style="flex:1;overflow:auto"></div>
          <div id="composer">
            <textarea id="cin" rows="1" placeholder="给 AI 派任务…"></textarea>
            <button id="send"><svg class="ic" style="width:14px" viewBox="0 0 24 24"><path d="m5 12 14-7-4 14-4-6z"/></svg></button>
          </div>
        </div>
        <div class="pane" id="p-decs" hidden></div>

function rng(s){return()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648}}
function genBars(sym){
  const r=rng(SEED[sym]||99),base={"600519.SH":1500,"000001.SZ":11,"300750.SZ":185,"601318.SH":46,"600036.SH":35}[sym]||50;
  let p=base,out=[];const t0=new Date("2025-05-19").getTime();
  for(let i=0;out.length<135;i++){const t=new Date(t0+i*86400000);if(t.getDay()==0||t.getDay()==6)continue;
    const drift=Math.sin(i/16)*0.011+(r()-0.487)*0.028,o=p,c=o*(1+drift);
    const h=Math.max(o,c)*(1+r()*0.011),l=Math.min(o,c)*(1-r()*0.011),v=Math.round((0.4+r())*90000);
    out.push({time:t.toISOString().slice(0,10),open:+o.toFixed(2),high:+h.toFixed(2),low:+l.toFixed(2),close:+c.toFixed(2),volume:v});p=c;}
  return out;
}

/* ═══ 图表 ═══ */
let cur="600519.SH",tool="cursor",meas=[],hlines=[],trends=[],tpts=[];
const TZ={layout:{background:{color:"#131313"},textColor:"#8c8c8c",fontFamily:'"Trebuchet MS",sans-serif',fontSize:11},
 grid:{vertLines:{color:"rgba(255,255,255,.04)",style:2},horzLines:{color:"rgba(255,255,255,.04)",style:2}},
 rightPriceScale:{borderColor:"#2a2a2a"},
 timeScale:{borderColor:"#2a2a2a"},
 crosshair:{mode:0,vertLine:{color:"#4a4e5c",labelBackgroundColor:"#2a2a2a"},horzLine:{color:"#4a4e5c",labelBackgroundColor:"#2a2a2a"}}};
const chart=LightweightCharts.createChart(document.getElementById("chart"),TZ);
let candle=chart.addCandlestickSeries({upColor:"#089981",downColor:"#f23645",wickUpColor:"#089981",wickDownColor:"#f23645",borderVisible:false});
const ma20=chart.addLineSeries({color:"#2962ff",lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const ma50=chart.addLineSeries({color:"#f0b90b",lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
const vol=chart.addHistogramSeries({priceScaleId:"vol",priceFormat:{type:"volume"},lastValueVisible:false});
chart.priceScale("vol").applyOptions({scaleMargins:{top:.84,bottom:0}});
const rser=chart.addLineSeries({color:"#b37ff5",lineWidth:1,priceScaleId:"rsi",lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false});
chart.priceScale("rsi").applyOptions({scaleMargins:{top:.87,bottom:0},visible:false});
const INDS={ma20:true,ma50:true,vol:true,rsi:true};
const fmtP=n=>n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
function ema(s,n){const k=2/(n+1);let e=[],p=s[0];s.forEach((v,i)=>{p=i?v*k+p*(1-k):v;e.push(p)});return e}
function rsiF(s,n){let o=[],g=0,l=0;for(let i=0;i<s.length;i++){if(!i){o.push(50);continue}
  const d=s[i]-s[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;o.push(l?100-100/(1+g/l):100)}return o}

function load(sym){
  const bars=DATA[sym],closes=bars.map(b=>b.close),times=bars.map(b=>b.time);
  candle.setData(bars);
  ma20.setData(INDS.ma20?times.map((t,i)=>({time:t,value:+ema(closes,20)[i].toFixed(2)})):[]);
  ma50.setData(INDS.ma50?times.map((t,i)=>({time:t,value:+ema(closes,50)[i].toFixed(2)})):[]);
  vol.setData(INDS.vol?bars.map(b=>({time:b.time,value:b.volume,color:b.close>=b.open?"rgba(8,153,129,.45)":"rgba(242,54,69,.45)"})):[]);
  rser.setData(INDS.rsi?times.map((t,i)=>({time:t,value:+rsiF(closes,14)[i].toFixed(2)})):[]);
  chart.priceScale("rsi").applyOptions({scaleMargins:{top:INDS.rsi?.87:1,bottom:0}});
  candle.setMarkers((DECS[sym]||[]).map(d=>({time:bars[d.t].time,position:d.a==="BUY"?"belowBar":"aboveBar",color:d.a==="BUY"?"#089981":"#f23645",shape:d.a==="BUY"?"arrowUp":"arrowDown",text:d.a})));
  const last=bars.at(-1),prev=bars.at(-2);
  updLegend(last);updSpread(last,prev);renderWatch();
}
function updLegend(b){const chg=(b.close-b.open)/b.open*100,cls=chg>=0?"up":"down";
  const h=`<span>O <b class="${cls}">${fmtP(b.open)}</b></span><span>H <b class="${cls}">${fmtP(b.high)}</b></span><span>L <b class="${cls}">${fmtP(b.low)}</b></span><span>C <b class="${cls}">${fmtP(b.close)}</b></span><b class="${cls}">${chg>=0?"+":""}${chg.toFixed(2)}%</b>`;
  document.getElementById("lgOhlc").innerHTML=h;document.getElementById("lgOhlc2").innerHTML=h;}
function updSpread(last,prev){const pct=(last.close-prev.close)/prev.close*100;
  document.getElementById("spSell").textContent=fmtP(last.close-0.01);
  document.getElementById("spBuy").textContent=fmtP(last.close);}
chart.subscribeCrosshairMove(p=>{if(!p.time)return;const b=p.seriesData.get(candle);if(b)updLegend(b)});
chart.subscribeClick(p=>{
  if(tool==="hline"&&p.point){const pr=candle.coordinateToPrice(p.point.y);
    if(pr!=null)hlines.push(candle.createPriceLine({price:pr,color:"#ff9800",lineWidth:1,lineStyle:2,axisLabelVisible:true}))}
  else if(tool==="trend"&&p.time){const pr=candle.coordinateToPrice(p.point.y);tpts.push({time:p.time,price:pr});
    if(tpts.length===2){const s=chart.addLineSeries({color:"#2962ff",lineWidth:2,crosshairMarkerVisible:false,lastValueVisible:false,priceLineVisible:false});
      s.setData(tpts.map(x=>({time:x.time,value:x.price})));trends.push(s);tpts=[]}}
  else if(tool==="measure"&&p.time){meas.push(p);if(meas.length===2){showMeasure();meas=[]}}
  else{const dm=document.getElementById("dmark");const ds=DECS[cur]||[];
    const hit=p.time&&ds.find(d=>DATA[cur][d.t].time===p.time);
    if(hit){dm.innerHTML=`<div style="display:flex;gap:6px;align-items:center"><span class="bdg ${hit.a==="BUY"?"b-buy":"b-sell"}">${hit.a}</span><b>${hit.ag}</b></div><div style="color:var(--muted);margin-top:4px">${hit.why}</div>`;
      dm.style.display="block";dm.style.left=Math.min(p.point.x+16,document.getElementById("chartzone").clientWidth-260)+"px";dm.style.top=Math.max(p.point.y-20,10)+"px";}
    else dm.style.display="none"}
});
function showMeasure(){const[a,b]=meas;const bars=DATA[cur];
  const ba=bars.find(x=>x.time===a.time),bb=bars.find(x=>x.time===b.time);if(!ba||!bb)return;
  const d=bb.close-ba.close,pct=d/ba.close*100,nb=Math.abs(bars.indexOf(bb)-bars.indexOf(ba));
  const tip=document.getElementById("mtip");
  tip.innerHTML=`<b class="${d>=0?"up":"down"}">${d>=0?"+":""}${d.toFixed(2)} (${pct>=0?"+":""}${pct.toFixed(2)}%)</b> · ${nb} 根 · ${fmtP(Math.min(ba.close,bb.close))}–${fmtP(Math.max(ba.close,bb.close))}`;
  tip.style.display="block";tip.style.left=(b.point.x+14)+"px";tip.style.top=(b.point.y-10)+"px";
  setTimeout(()=>tip.style.display="none",4500);}

  const n={ma20:"MA 20",ma50:"MA 50",vol:"成交量",rsi:"RSI 14"};

    ks.map(k=>`<div data-k="${k}" style="display:flex;justify-content:space-between;align-items:center;padding:6px 9px;border-radius:5px;cursor:pointer;font-size:12.5px" onmouseover="this.style.background='var(--hover)'" onmouseout="this.style.background=''"><span>${n[k]}</span><span style="color:var(--blue)">${INDS[k]?"✓":""}</span></div>`).join("")).join("");

/* ═══ ⌘K ═══ */
const cmdk=document.getElementById("cmdk"),ckin=document.getElementById("ckin"),cklist=document.getElementById("cklist");
let ckSel=0,ckItems=[];
function renderCk(q){
  const items=Object.entries(SYMS).filter(([c,n])=>!q||c.includes(q)||n.includes(q));
  if(q&&/^\d{6}/.test(q)&&!items.some(([c])=>c.startsWith(q)))items.unshift([q[0]==="6"?q+".SH":q+".SZ","输入的代码"]);
  ckItems=items;
  cklist.innerHTML=items.map(([c,n],i)=>`<div class="it${i===ckSel?" sel":""}" data-c="${c}"><span class="lg" style="background:${LGC[c]||"#555"}">${n[0]}</span><span style="font-weight:600">${c}</span><span class="nm">${n}</span></div>`).join("")||`<div class="empty">无匹配</div>`;
  cklist.querySelectorAll(".it").forEach(el=>el.onclick=()=>pickSym(el.dataset.c));
}
function openCmdk(){cmdk.classList.add("open");ckSel=0;ckin.value="";renderCk("");ckin.focus()}
function closeCmdk(){cmdk.classList.remove("open")}
ckin.oninput=()=>{ckSel=0;renderCk(ckin.value.trim())};
ckin.onkeydown=e=>{
  if(e.key==="ArrowDown"){e.preventDefault();ckSel=Math.min(ckSel+1,ckItems.length-1);renderCk(ckin.value.trim())}
  else if(e.key==="ArrowUp"){e.preventDefault();ckSel=Math.max(ckSel-1,0);renderCk(ckin.value.trim())}
  else if(e.key==="Enter"){const it=ckItems[ckSel];if(it)pickSym(it[0])}
  else if(e.key==="Escape")closeCmdk()};
function pickSym(c){if(!DATA[c]){DATA[c]=genBars(c);SYMS[c]="A股 "+c.split(".")[0];LGC[c]="#8c8c8c"}
  cur=c;document.getElementById("symName").textContent=c;
  document.getElementById("lgSym").textContent=c;document.getElementById("symTitle").textContent=SYMS[c];
  load(c);closeCmdk()}
document.getElementById("symBtn").onclick=openCmdk;
cmdk.onclick=e=>{if(e.target===cmdk)closeCmdk()};
window.onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();openCmdk()}};

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2200)}
let _menu=null;
function closeMenu(){if(_menu){_menu.remove();_menu=null}}
document.addEventListener("mousedown",e=>{if(_menu&&!_menu.contains(e.target))closeMenu()});
function menu(anchor,items,opts={}){
  if(_menu){closeMenu();if(_menu._a===anchor)return;_menu=null}
  const m=document.createElement("div");m.className="dmenu";m._a=anchor;
  if(opts.search){const s=document.createElement("input");s.className="msrc";s.placeholder=opts.search;
    s.oninput=()=>{m.querySelectorAll(".mi[data-t]").forEach(x=>x.style.display=x.dataset.t.toLowerCase().includes(s.value.toLowerCase())?"":"none")};m.appendChild(s)}
  for(const it of items){
    if(it==="sep"){const d=document.createElement("div");d.className="msept";m.appendChild(d);continue}
    if(it.sec){const d=document.createElement("div");d.className="msec";d.textContent=it.sec;m.appendChild(d);continue}
    const d=document.createElement("div");d.className="mi"+(it.on?" on":"");d.dataset.t=it.t||"";
    d.innerHTML=`${it.icon?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${it.icon}</svg>`:""}<span>${it.t}</span>${it.kv?`<span class="kv">${it.kv}</span>`:""}${it.check?`<span class="chk">${it.on?"✓":""}</span>`:""}`;
    d.onclick=()=>{closeMenu();it.fn&&it.fn()};m.appendChild(d)}
  document.body.appendChild(m);
  const r=anchor.getBoundingClientRect();
  let x=opts.right?r.right-m.offsetWidth:r.left,y=r.bottom+4;
  m.style.left=Math.max(4,Math.min(x,innerWidth-m.offsetWidth-8))+"px";m.style.top=y+"px";
  _menu=m;const s=m.querySelector(".msrc");if(s)setTimeout(()=>s.focus(),0)}
