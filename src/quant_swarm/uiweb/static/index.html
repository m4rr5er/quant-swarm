<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quant$warm</title>
<link rel="stylesheet" href="/static/vendor/tabler.min.css">
<link rel="stylesheet" href="/static/vendor/tabler-icons.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <nav id="rail">
    <div class="logo">Q$</div>
    <button class="nav on" data-page="chat"><i class="ti ti-message-2"></i><span>对话</span></button>
    <button class="nav" data-page="agents"><i class="ti ti-cpu"></i><span>组件</span></button>
    <button class="nav" data-page="cards"><i class="ti ti-stack-2"></i><span>卡片</span></button>
    <button class="nav" data-page="decisions"><i class="ti ti-target"></i><span>决策</span></button>
    <button class="nav" data-page="portfolio"><i class="ti ti-briefcase"></i><span>持仓</span></button>
    <button class="nav" data-page="risk"><i class="ti ti-shield"></i><span>风控</span></button>
    <button class="nav" data-page="learning"><i class="ti ti-brain"></i><span>学习</span></button>
  </nav>

  <main>
    <header id="topbar">
      <span class="navbar-brand">Quant<b>$warm</b></span>
      <span id="status" class="badge"><i class="status-dot"></i>connecting…</span>
      <span class="spacer"></span>
      <span id="clock" class="clock"></span>
    </header>

    <section id="page-chat" class="page on">
      <div id="chat-scroll"><div id="chat-list"></div></div>
      <div id="composer">
        <div class="composer-inner">
          <input id="chat-input" class="form-control" placeholder="给决策 AI 下达任务，如：茅台现在能加仓吗 / 回测一下双均线" autocomplete="off">
          <button id="chat-send" class="btn btn-primary"><i class="ti ti-send"></i></button>
        </div>
      </div>
    </section>

    <section id="page-agents" class="page"><div class="pad"><div class="card"><div class="table-responsive"><table id="tbl-agents" class="table table-vcenter card-table"></table></div></div></div></section>
    <section id="page-cards" class="page"><div class="pad"><div class="card"><div class="table-responsive"><table id="tbl-cards" class="table table-vcenter card-table"></table></div></div></div></section>
    <section id="page-decisions" class="page"><div class="pad"><div class="card"><div class="table-responsive"><table id="tbl-decisions" class="table table-vcenter card-table"></table></div></div></div></section>
    <section id="page-portfolio" class="page"><div class="pad">
      <div id="kpis" class="row row-deck row-cards mb-3"></div>
      <div class="card mb-3"><div class="card-header"><h3 class="card-title">持仓</h3></div>
        <div class="table-responsive"><table id="tbl-pos" class="table table-vcenter card-table"></table></div></div>
      <div class="card"><div class="card-header"><h3 class="card-title">成交</h3></div>
        <div class="table-responsive"><table id="tbl-fills" class="table table-vcenter card-table"></table></div></div>
    </div></section>
    <section id="page-risk" class="page"><div class="pad"><div class="card"><div class="table-responsive"><table id="tbl-risk" class="table table-vcenter card-table"></table></div></div></div></section>
    <section id="page-learning" class="page"><div class="pad split">
      <div><h4 class="subheader mb-2">学习报告</h4><div id="reports"></div></div>
      <div><h4 class="subheader mb-2">记忆与技能文件</h4>
        <div id="files">
          <div id="file-list" class="list-group list-group-transparent"></div>
          <pre id="file-view" class="card card-body">← 选择文件查看</pre>
        </div>
      </div>
    </div></section>
  </main>
</div>

<div id="modal" class="modal-blur hidden"><div class="modal-dialog modal-lg modal-dialog-centered">
  <div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">卡片详情</h5>
      <button id="modal-close" class="btn-close"></button></div>
    <div class="modal-body"><pre id="modal-body"></pre></div>
  </div>
</div></div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
